[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-mvp"
version = "0.1.0"
description = "MVP de modelagem de ameaças STRIDE a partir de diagramas de arquitetura"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FIAP IADT" }]
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  # Cap major to stop pip backtracking across every pytest 8.x when resolving
  # the large ml/ui tree (see pip "stricter constraints" warning).
  "pytest>=8.0,<10",
]
ml = [
  "ultralytics>=8.3,<9",
  # OpenCV 4.12+ requires numpy>=2; keep below 5.x for Ultralytics stability.
  # Ultralytics depends on opencv-python (non-headless) — pin both to the same
  # major so the resolver does not thrash across OpenCV 4/5 + numpy majors.
  "opencv-python-headless>=4.8,<5",
  "opencv-python>=4.8,<5",
]
ui = [
  # Gradio <4.44 pins numpy~=1.0 and conflicts with OpenCV/Ultralytics (numpy 2)
  "gradio>=4.44.0,<7",
]
kaggle = [
  "kaggle>=1.6,<3",
]

[project.scripts]
stride-mvp = "stride_mvp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
