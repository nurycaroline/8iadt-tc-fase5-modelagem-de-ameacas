# Threat knowledge base (KB-01..04) — family × STRIDE → vulnerability + countermeasure
version: 2

# Role per family: control (security/observability/edge), zone (network zones),
# external (client). Unlisted families default to ``workload``.
roles:
  security: control
  observability: control
  edge: control
  backup: control
  scaling: control
  zone: zone
  client: external
  dependency: external
  management: scope

fallback:
  threat: "Componente não classificado — inventariar antes de assumir risco"
  vulnerability: "Família/componente ausente do class_map ou da KB"
  countermeasure: "Inventariar o componente, identificar o serviço real e mapeá-lo a uma família STRIDE"

entries:
  - family: database
    stride: Spoofing
    threat: "Autenticação fraca ao banco de dados"
    vulnerability: "Credenciais padrão ou compartilhadas"
    countermeasure: "IAM/roles, rotação de segredos, MFA onde aplicável"
  - family: database
    stride: Tampering
    threat: "Alteração não autorizada de dados"
    vulnerability: "Ausência de controles de integridade / auditoria"
    countermeasure: "Controles de escrita, checksums, audit logs imutáveis"
  - family: database
    stride: Repudiation
    threat: "Ações sem rastreabilidade"
    vulnerability: "Logs de acesso ausentes ou incompletos"
    countermeasure: "Auditoria completa de queries e acessos privilegiados"
  - family: database
    stride: Information Disclosure
    threat: "Exposição de dados em repouso ou em trânsito"
    vulnerability: "Instância/cluster de DB sem criptografia ou exposta via Security Groups/Subnets"
    countermeasure: "Criptografia at-rest, least privilege, private endpoints"
  - family: database
    stride: Denial of Service
    threat: "Indisponibilidade do banco"
    vulnerability: "Sem limites de conexão / sem réplicas"
    countermeasure: "Rate limiting, autoscaling de leituras, backups testados"
  - family: database
    stride: Elevation of Privilege
    threat: "Escalação de privilégios no SGBD"
    vulnerability: "Usuário da aplicação com permissões excessivas"
    countermeasure: "Princípio do menor privilégio e roles separadas"

  - family: compute
    stride: Spoofing
    threat: "Impersonação de instância ou função"
    vulnerability: "Metadados de instância expostos / identidade fraca"
    countermeasure: "IMDSv2, identities de workload, segmentação"
  - family: compute
    stride: Tampering
    threat: "Código ou imagem adulterados"
    vulnerability: "Imagens sem assinatura / supply chain frágil"
    countermeasure: "Assinatura de imagens, SBOM, registries privados"
  - family: compute
    stride: Information Disclosure
    threat: "Vazamento de segredos em runtime"
    vulnerability: "Variáveis de ambiente com secrets em claro"
    countermeasure: "Secrets manager, volumes criptografados"
  - family: compute
    stride: Denial of Service
    threat: "Esgotamento de CPU/memória"
    vulnerability: "Sem quotas ou autoscaling"
    countermeasure: "Quotas, HPA, circuit breakers"
  - family: compute
    stride: Elevation of Privilege
    threat: "Escape de container / host"
    vulnerability: "Containers privilegiados"
    countermeasure: "Pod security, non-root, seccomp"

  - family: api
    stride: Spoofing
    threat: "Cliente forjado na API"
    vulnerability: "Ausência de autenticação forte"
    countermeasure: "OAuth2/OIDC, mTLS, API keys rotacionadas"
  - family: api
    stride: Tampering
    threat: "Manipulação de payloads"
    vulnerability: "Validação de entrada insuficiente"
    countermeasure: "Schema validation, WAF, assinatura de requests"
  - family: api
    stride: Information Disclosure
    threat: "Vazamento via respostas de erro"
    vulnerability: "Stack traces e dados sensíveis em respostas"
    countermeasure: "Erros genéricos, mascaramento de PII"
  - family: api
    stride: Denial of Service
    threat: "Flood na API"
    vulnerability: "Sem rate limiting"
    countermeasure: "Throttling, quotas por cliente, CDN"
  - family: api
    stride: Elevation of Privilege
    threat: "Bypass de autorização"
    vulnerability: "IDOR / falhas de checagem de escopo"
    countermeasure: "Autorização por recurso, testes de IDOR"

  - family: storage
    stride: Information Disclosure
    threat: "Objetos públicos indevidos"
    vulnerability: "ACL/policy permissiva em bucket"
    countermeasure: "Block public access, políticas least-privilege"
  - family: storage
    stride: Tampering
    threat: "Sobrescrita de objetos"
    vulnerability: "Sem versionamento / MFA delete"
    countermeasure: "Versioning, Object Lock, MFA delete"
  - family: storage
    stride: Denial of Service
    threat: "Custos/indisponibilidade por listagem abusiva"
    vulnerability: "Sem quotas de request"
    countermeasure: "Monitoramento de custo, WAF, private endpoints"

  - family: filesystem
    stride: Spoofing
    threat: "Montagem não autorizada do sistema de arquivos"
    vulnerability: "EFS Mount Targets expostos a subnets/SGs indevidos"
    countermeasure: "Restringir mount targets a subnets privadas e Security Groups least-privilege"
  - family: filesystem
    stride: Tampering
    threat: "Alteração indevida de arquivos via permissões POSIX fracas"
    vulnerability: "POSIX permissions/ownership permissivos no share NFS"
    countermeasure: "Revisar UID/GID e permissões POSIX; habilitar access points com políticas"
  - family: filesystem
    stride: Information Disclosure
    threat: "Exposição de dados em trânsito ou em repouso no filesystem"
    vulnerability: "Ausência de criptografia em trânsito (TLS) ou em repouso"
    countermeasure: "Criptografia at-rest com KMS e montagem com TLS obrigatório"

  - family: backup
    stride: Spoofing
    threat: "Acesso indevido ao vault de backup"
    vulnerability: "Políticas de acesso ao Backup Vault excessivamente amplas"
    countermeasure: "Restringir IAM ao vault, Vault Access Policies e auditoria de quem restaura"
  - family: backup
    stride: Tampering
    threat: "Exclusão ou alteração de backups protegidos"
    vulnerability: "Ausência de Vault Lock / imutabilidade; cross-account backup não controlado"
    countermeasure: "Habilitar Vault Lock (compliance mode), bloquear cross-account não autorizado e alertar exclusões"

  - family: email
    stride: Spoofing
    threat: "Envio de e-mails em nome do domínio sem autenticação"
    vulnerability: "Domínio sem validação adequada de remetente"
    countermeasure: "Configurar SPF, DKIM e DMARC estritos no domínio verificado do SES"
  - family: email
    stride: Tampering
    threat: "Conteúdo de e-mail adulterado ou templates comprometidos"
    vulnerability: "Templates/identidades SES editáveis sem revisão"
    countermeasure: "Controlar identidades verificadas via IAM least-privilege e revisar templates"
  - family: email
    stride: Denial of Service
    threat: "Abuso de cotas de envio / reputação"
    vulnerability: "Sem limites de taxa ou monitoramento de bounce/complaint"
    countermeasure: "Configurar limites de envio, alarms de reputação e sandbox/produção controlados"

  - family: scaling
    stride: Tampering
    threat: "Manipulação de políticas de Auto Scaling"
    vulnerability: "Permissões amplas para alterar desired/min/max capacity"
    countermeasure: "Restringir IAM de UpdateAutoScalingGroup, mudanças via IaC com revisão"
  - family: scaling
    stride: Denial of Service
    threat: "DoS financeiro ou exaustão por escalonamento abusivo"
    vulnerability: "Limites de capacidade ausentes ou max capacity excessivo"
    countermeasure: "Definir max capacity, budgets/alerts de custo e revisar políticas de scaling"

  - family: integration
    stride: Spoofing
    threat: "Uso indevido de conectores / identidades de integração"
    vulnerability: "Tokens de conectores de longa duração ou credenciais compartilhadas"
    countermeasure: "Managed Identity para autenticar backends; rotacionar secrets de conectores"
  - family: integration
    stride: Tampering
    threat: "Injeção de payload malicioso repassado sem sanitização"
    vulnerability: "Ausência de validação de schema na entrada da Logic App"
    countermeasure: "Validação de schema na entrada e rejeição de payloads fora do contrato"
  - family: integration
    stride: Elevation of Privilege
    threat: "Escalonamento via autorização fraca na orquestração"
    vulnerability: "Conectores com escopos excessivos / RBAC frouxo"
    countermeasure: "RBAC least-privilege nas Logic Apps e escopos mínimos nos conectores"

  - family: azure_platform
    stride: Spoofing
    threat: "Chamadas à API Azure com identidade forjada ou credencial estática"
    vulnerability: "Service principal com segredo de longa duração em vez de Managed Identity"
    countermeasure: "Autenticar com Managed Identity; evitar secrets embutidos nas Logic Apps"
  - family: azure_platform
    stride: Elevation of Privilege
    threat: "Escalonamento via RBAC Azure excessivo"
    vulnerability: "Role assignments amplas (Owner/Contributor) no Resource Group alvo"
    countermeasure: "RBAC least-privilege nas identities que chamam o Azure Resource Manager"
  - family: azure_platform
    stride: Information Disclosure
    threat: "Exposição de dados via APIs Azure mal escopadas"
    vulnerability: "Permissões de leitura amplas em subscriptions/resources"
    countermeasure: "Escopos mínimos por recurso e Private Endpoints onde aplicável"

  - family: backend
    stride: Spoofing
    threat: "Backend REST/SOAP aceita chamadas sem autenticação mútua"
    vulnerability: "Ausência de mTLS entre o API Gateway/Logic Apps e o backend"
    countermeasure: "Exigir mTLS (certificado cliente) na frente do backend REST/SOAP"
  - family: backend
    stride: Information Disclosure
    threat: "Tráfego REST/SOAP em claro ou com TLS fraco"
    vulnerability: "Endpoint HTTP público ou TLS desatualizado no backend legado"
    countermeasure: "TLS 1.2+ obrigatório, sem exposição pública direta — só via Gateway/VNet"
  - family: backend
    stride: Tampering
    threat: "Payload SOAP/REST adulterado em trânsito ou na borda"
    vulnerability: "Sem validação de schema/assinatura nas mensagens do backend"
    countermeasure: "Validação de schema XML/JSON e restrição de origem ao Gateway"

  - family: dependency
    stride: Spoofing
    threat: "Impersonação via tokens de integração de terceiros"
    vulnerability: "Vazamento de tokens OAuth/API keys de SaaS"
    countermeasure: "Credenciais de curta duração, rotação e vault para secrets de integração"
  - family: dependency
    stride: Information Disclosure
    threat: "Exposição de dados a conectores SaaS com consentimento excessivo"
    vulnerability: "Escopos de consentimento amplos em conectores externos"
    countermeasure: "Revisar escopos OAuth, princípio do menor privilégio e conectores aprovados"
  - family: dependency
    stride: Tampering
    threat: "Conector SaaS inseguro adulterando dados de integração"
    vulnerability: "Dependência de terceiro sem controles de integridade/contrato"
    countermeasure: "Contratos de integração, validação de resposta e monitoramento de anomalias"

  - family: network
    stride: Spoofing
    threat: "Tráfego forjado entre segmentos"
    vulnerability: "Sem segmentação adequada"
    countermeasure: "Security groups, NACLs, microsegmentação"
  - family: network
    stride: Information Disclosure
    threat: "Sniffing em trânsito"
    vulnerability: "Tráfego sem TLS"
    countermeasure: "TLS em trânsito, VPN/private link"
  - family: network
    stride: Denial of Service
    threat: "Saturação de banda/links"
    vulnerability: "Sem proteção DDoS"
    countermeasure: "Shield/WAF, autoscaling de edge"

  - family: edge
    stride: Spoofing
    threat: "Bypass de origem — requisições chegam ao ALB sem passar pelo CloudFront"
    vulnerability: "ALB/origem aceita tráfego de qualquer origem; ausência de cabeçalho customizado ou restrição por VPC/SG"
    countermeasure: "Restringir a origem: SG do ALB liberando só os prefixos do CloudFront, cabeçalho customizado de origem ou Origin Access Control"
  - family: edge
    stride: Tampering
    threat: "Manipulação de regras do WAF/Shield"
    vulnerability: "Regras WAF versionadas sem aprovação; permissões amplas de edição"
    countermeasure: "WAF em IaC/terraform, revisão obrigatória, change management e alertas de alteração"
  - family: edge
    stride: Denial of Service
    threat: "Ataques volumétricos/l7 não mitigados na borda"
    vulnerability: "WAF/Shield desabilitados ou com regras em modo de contagem; rate limit ausente"
    countermeasure: "Habilitar AWS Shield Advanced/WAF em modo de bloqueio, rate limiting por IP/URI e monitoramento de eficácia"

  - family: observability
    stride: Repudiation
    threat: "Trilha de auditoria desativada ou com retenção insuficiente"
    vulnerability: "CloudTrail em região única, sem eventos de dados, ou retenção curta; logs sem proteção"
    countermeasure: "CloudTrail multi-região com eventos de dados, log file integrity validation, retenção ≥ 1 ano e alertas de desativação"
  - family: observability
    stride: Tampering
    threat: "Logs/métricas adulteráveis"
    vulnerability: "Log group sem proteção contra exclusão/alteração; sem alertas de mute"
    countermeasure: "Lock de exclusão de log groups, alarmes do CloudWatch para 'mute' e alterações de retenção, exportação imutável"

  - family: zone
    stride: Tampering
    threat: "Configuração de zona expõe workloads indevidamente"
    vulnerability: "Security Groups/NACLs permissivos; rotas públicas para recursos privados; ausência de isolamento"
    countermeasure: "Revisar SG/NACLs (least privilege), rotas, e garantir que workloads não-edge fiquem em subnets privadas"

  - family: security
    stride: Spoofing
    threat: "Uso indevido de identidades"
    vulnerability: "Chaves de longa duração"
    countermeasure: "Credenciais de curta duração, rotação"
  - family: security
    stride: Elevation of Privilege
    threat: "Políticas IAM excessivas"
    vulnerability: "Wildcards em actions/resources"
    countermeasure: "Least privilege, access analyzer"
  - family: security
    stride: Information Disclosure
    threat: "Segredos expostos"
    vulnerability: "Secrets em repositório ou logs"
    countermeasure: "Vault/KMS, scanning de secrets"

  - family: messaging
    stride: Spoofing
    threat: "Publicação forjada em tópicos"
    vulnerability: "Filas sem autenticação de publishers"
    countermeasure: "IAM em filas/tópicos, assinatura de mensagens"
  - family: messaging
    stride: Tampering
    threat: "Mensagens adulteradas"
    vulnerability: "Sem integridade/criptografia"
    countermeasure: "Encryption in transit/at rest, checksums"
  - family: messaging
    stride: Denial of Service
    threat: "Enchimento de fila"
    vulnerability: "Sem DLQ / limites"
    countermeasure: "DLQ, retenção, backpressure"

  - family: client
    stride: Spoofing
    threat: "Usuário forjado no cliente"
    vulnerability: "Sessões previsíveis / sem MFA"
    countermeasure: "MFA, cookies seguros, binding de sessão"
  - family: client
    stride: Tampering
    threat: "Manipulação do cliente"
    vulnerability: "Lógica sensível só no front-end"
    countermeasure: "Validação server-side, attested clients"
  - family: client
    stride: Information Disclosure
    threat: "Dados sensíveis no dispositivo"
    vulnerability: "Cache/localStorage com PII"
    countermeasure: "Minimizar dados locais, criptografia de storage"
  - family: client
    stride: Repudiation
    threat: "Ações do usuário sem prova"
    vulnerability: "Sem trilha de auditoria no cliente→servidor"
    countermeasure: "Logs de autenticação e ações críticas"
